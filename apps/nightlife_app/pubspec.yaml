
name: nightlife_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  cloud_firestore: ^5.6.6
  firebase_storage: ^12.4.5
  firebase_messaging: ^15.2.5
  vex_core:
    path: ../../packages/vex_core
  vex_engines:
    path: ../../packages/vex_engines
  intl: ^0.19.0
  google_maps_flutter:
  geolocator:
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/backgrounds/
    - assets/vexda_logo.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/drinkspot_launcher.png"
  adaptive_icon_background: "#05000A"
  adaptive_icon_foreground: "assets/branding/drinkspot_logo_icon.png"
